<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - Zuno</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/styles-navbar.css">
    <link rel="stylesheet" href="../css/styles-cart.css">
</head>
<body>
    <!-- Navbar reutilizado para conservar identidad visual y navegacion global -->
    <nav class="navbar-glass">
        <div class="navbar-container">
            <div class="navbar-logo">
                <a href="./intex.html"><span class="logo-text">ZUNO</span></a>
            </div>

            <ul class="nav-links">
                <li><a href="./shop.html">Explorar</a></li>
                <li><a href="./categories.html">Categorías</a></li>
                <li><a href="./trending.html">Tendencias</a></li>
                <li><a href="./how-it-works.html">Cómo funciona</a></li>
                <li><a class="nav-special" href="./seller.html">Vender</a></li>
                <!-- Perfil mobile: antes apuntaba a login.html; se reemplaza por profile.html para que el menu responsive use el mismo destino global que el icono de perfil. -->
                <li class="mobile-profile-link"><a href="./profile.html">Perfil</a></li>
            </ul>

            <div class="navbar-right">
                <div class="search-bar">
                    <input type="text" placeholder="Buscar productos..." id="navbar-search">
                    <button class="search-btn" aria-label="Buscar">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M21 21L16.5 16.5M19 11C19 15.4183 15.4183 19 11 19S3 15.4183 3 11 6.58172 3 11 3s8 3.58172 8 8z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
                <button class="cart-btn" aria-label="Carrito">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 22C7.89543 22 7 21.1046 7 20V8C7 6.89543 7.89543 6 9 6H15C16.1046 6 17 6.89543 17 8V20C17 21.1046 16.1046 22 15 22H9Z" stroke="currentColor" stroke-width="2"/>
                        <path d="M7 6V4C7 2.89543 7.89543 2 9 2H15C16.1046 2 17 2.89543 17 4V6" stroke="currentColor" stroke-width="2"/>
                        <circle cx="9.5" cy="20.5" r="0.5" fill="currentColor"/>
                        <circle cx="14.5" cy="20.5" r="0.5" fill="currentColor"/>
                    </svg>
                    <span class="cart-count">0</span>
                </button>
                <!-- Perfil global: antes era <button> sin href y dependia de listeners por pagina; se reemplaza por <a> para que el navbar siempre navegue a profile.html en la misma pestana. -->
                <a href="./profile.html" class="profile-btn" aria-label="Perfil">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20 21V19C20 17.9391 19.5786 16.9217 18.8284 16.1716C18.0783 15.4214 17.0609 15 16 15H8C6.93913 15 5.92172 15.4214 5.17157 16.1716C4.42143 16.9217 4 17.9391 4 19V21M16 7C16 9.20914 14.2091 11 12 11C9.79086 11 8 9.20914 8 7C8 4.79086 9.79086 3 12 3C14.2091 3 16 4.79086 16 7Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </a>
            </div>

            <button class="nav-toggle" aria-label="Abrir menú">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <main class="cart-content">
        <section class="cart-header">
            <h1>Tu carrito</h1>
        </section>

        <section class="cart-layout" id="cart-layout">
            <div class="cart-list" id="cart-list"></div>

            <aside class="cart-summary" id="cart-summary">
                <h2>Resumen</h2>
                <div class="summary-row">
                    <span>Productos seleccionados</span>
                    <strong id="selected-count">0</strong>
                </div>
                <div class="summary-row summary-total">
                    <span>Total</span>
                    <strong id="selected-total">$0.00</strong>
                </div>
                <button class="btn-pay" id="btn-pay" disabled>Pagar</button>
            </aside>
        </section>

        <section class="cart-empty" id="cart-empty" hidden>
            <h2>Tu carrito está vacío</h2>
            <a class="btn-explore" href="./shop.html">Explorar productos</a>
        </section>
    </main>

    <script src="../js/script-cart-utils.js"></script>
    <script src="../js/script-cart.js"></script>
    <!-- Busqueda global: conecta el input del navbar con la misma logica inteligente de productos; en paginas sin grid redirige a shop.html?q=... -->
    <script src="../js/script-search.js"></script>
</body>
</html>
